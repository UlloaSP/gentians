<line x1="55" y1="510" x2="1325" y2="510" stroke="#111827" stroke-width="2"/>
<text class="note" x="55" y="544">GENTIANS: total_execution. ILASP: %% Total. Ambas métricas incluyen la generación del espacio propio.</text>
<text class="note" x="55" y="570">* Hubo timeout: la media usa solo los runs resueltos; “t.o.” indica que ninguno terminó antes de 30 s.</text>
<text class="note" x="55" y="596">Las celdas sin asterisco son medias de 3/3 runs. El menor tiempo resuelto de cada fila aparece en negrita.</text>
</svg>
