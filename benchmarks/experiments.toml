# List:  python benchmarks/run_experiments.py --list
# Run:   python benchmarks/run_experiments.py cov_program_random_group_pop10_mut09
# Rerun: python benchmarks/run_experiments.py cov_program_random_group_pop10_mut09 --force
# Run all entries by omitting experiment IDs.
[suite]
output_root = ".benchmarks"
datasets = [
    "5queens",
    "grandparent",
    #"coloring",
    #"latin_square",
    #"magic_square_no_diag",
    #"subset_sum_double",
    #"subset_sum_double_unbalanced",
    #"subset_sum_double_unbalanced_count",
    #"subset_sum_double_and_prod",
    #"subset_sum_double_and_prod_unbalanced",
    #"subset_sum_triple",
    #"set_partition_sum",
    #"set_partition_sum_and_cardinality",
    #"set_partition_sum_cardinality_and_square",
]
runs = 10
timeout_seconds = 100
seed_base = 1
# Deterministic cProfile changes runtime in proportion to Python call count and
# would bias strategy comparisons. Enable it in a separate profiling config.
cprofile = false

# Controls shared by all fitness experiments.
[suite.overrides]

#[[experiment]]
#id = "cov_program"
#label = "Whole program"
#description = "Whole-program score using per-candidate grounding and brave consequences."
#[experiment.overrides]
#"evaluation.scoring" = "cov_program"

[[experiment]]
id = "cov_program_random_group_pop10_mut09"
label = "Whole program · random · population 10 · mutation 0.9"
description = "Random-group mutation with population 10 and mutation probability 0.9."
runs = 10
[experiment.overrides]
"evaluation.scoring" = "cov_program"
"selection.name" = "tournament"
"mutation.name" = "random_group"
"population.size" = 10
"mutation.probability" = 0.9
"selection.tournament_percentage" = 0.3

[[experiment]]
id = "cov_program"
label = "Whole program · random · population 100 · mutation 0.9"
description = "Random-group mutation with population 100 and mutation probability 0.9."
[experiment.overrides]
"evaluation.scoring" = "cov_program"
"selection.name" = "lexicase"
"mutation.name" = "random_group"
"population.size" = 100
"mutation.probability" = 0.9
"selection.tournament_percentage" = 0.3

[[experiment]]
id = "cov_program_lexicase_pop10_mut09"
label = "Whole program · lexicase · population 10 · mutation 0.9"
description = "Lexicase selection under the random-group population-10 baseline conditions."
runs = 10
[experiment.overrides]
"evaluation.scoring" = "cov_program"
"selection.name" = "lexicase"
"mutation.name" = "random_group"
"population.size" = 10
"mutation.probability" = 0.9
"selection.tournament_percentage" = 0.3

[[experiment]]
id = "cov_program_behavior_tournament_pop10"
label = "Whole program · behavior tournament · population 10"
description = "Behavior-tournament selection with population 10 and random-group mutation."
[experiment.overrides]
"evaluation.scoring" = "cov_program"
"selection.name" = "behavior_tournament"
"selection.tournament_percentage" = 0.3
"mutation.name" = "random_group"
"population.size" = 10
"mutation.probability" = 0.9

[[experiment]]
id = "cov_program_behavior_tournament_pop100"
label = "Whole program · behavior tournament · population 100"
description = "Behavior-tournament selection with population 100 and random-group mutation."
[experiment.overrides]
"evaluation.scoring" = "cov_program"
"selection.name" = "behavior_tournament"
"selection.tournament_percentage" = 0.3
"mutation.name" = "random_group"
"population.size" = 100
"mutation.probability" = 0.9

[[experiment]]
id = "cov_balanced"
label = "Balanced coverage · random · population 10 · mutation 0.9"
description = "Balanced-accuracy coverage under the random-group baseline conditions."
runs = 10
[experiment.overrides]
"evaluation.scoring" = "cov_balanced"
"selection.name" = "tournament"
"mutation.name" = "random_group"
"population.size" = 10
"mutation.probability" = 0.9
"selection.tournament_percentage" = 0.3

[[experiment]]
id = "cov_balanced_structural"
label = "Balanced coverage · structural · population 10 · mutation 0.9"
description = "Balanced-accuracy coverage under the structural-group baseline conditions."
runs = 10
[experiment.overrides]
"evaluation.scoring" = "cov_balanced"
"selection.name" = "tournament"
"mutation.name" = "structural_neighbor"
"mutation.random_jump_probability" = 0.0
"population.size" = 10
"mutation.probability" = 0.9
"selection.tournament_percentage" = 0.3

