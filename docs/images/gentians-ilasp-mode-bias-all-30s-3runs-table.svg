<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="650" viewBox="0 0 1380 650">
<title>Comparación de tiempos de GENTIANS e ILASP generando sus propios espacios</title>
<desc>Medias de tres runs con límite de treinta segundos. El asterisco indica que hubo timeouts.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Georgia,Times New Roman,serif;fill:#111827}.caption{font-size:21px;font-weight:700}.header{font-size:18px;font-weight:700}.cell{font-size:18px}.dataset{font-size:18px;font-style:italic}.note{font-size:15px}</style>
<text class="caption" x="55" y="42">Tiempos medios en segundos de GENTIANS e ILASP</text>
<text class="cell" x="55" y="68">3 runs por dataset · timeout de 30 s · cada sistema genera su propio espacio desde el language bias</text>
