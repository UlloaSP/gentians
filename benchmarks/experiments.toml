# SDK baseline and matched mutation-probability experiments.
[suite]
output_root = ".benchmarks/experiments"
datasets = ["5queens", "grandparent"]
runs = 10
seed_base = 1
timeout_seconds = 30
cprofile = false
instrumentation = "full"

[[experiment]]
id = "sdk-defaults/steady_state"
description = "Steady-state with current SDK defaults."
runs = 30
[experiment.overrides]
algorithm = "steady_state"

[[experiment]]
id = "sdk-defaults/incremental"
description = "Incremental with current SDK defaults."
runs = 30
[experiment.overrides]
algorithm = "incremental"

[[experiment]]
id = "alzheimer/incremental"
description = "Four Alzheimer's drug-design tasks from the ILP datasets collection."
datasets = [
  "alzheimer_acetyl",
  "alzheimer_amine",
  "alzheimer_mem",
  "alzheimer_toxic",
]
runs = 1
timeout_seconds = 1200
instrumentation = "full"
[experiment.overrides]
algorithm = "incremental"

[[experiment]]
id = "ilasp-mode-bias-all-30s-3runs/gentians-steady_state"
description = "Gentians steady-state full pipeline for the ILASP mode-bias comparison."
datasets = [
  "4queens",
  "5queens",
  "adj2red",
  "clique",
  "coin",
  "coloring",
  "even_odd",
  "grandparent",
  "sudoku",
]
runs = 3
timeout_seconds = 30
instrumentation = "light"
[experiment.overrides]
algorithm = "steady_state"

[[experiment]]
id = "ilasp-mode-bias-all-30s-3runs/gentians-incremental"
description = "Gentians incremental full pipeline for the ILASP mode-bias comparison."
datasets = [
  "4queens",
  "5queens",
  "adj2red",
  "clique",
  "coin",
  "coloring",
  "even_odd",
  "grandparent",
  "sudoku",
]
runs = 3
timeout_seconds = 30
instrumentation = "light"
[experiment.overrides]
algorithm = "incremental"

[[experiment]]
id = "ilasp-mode-bias-all-120s-10runs/gentians-steady_state"
description = "Gentians steady-state full pipeline on the nine ILASP mode-bias tasks."
datasets = [
  "4queens",
  "5queens",
  "adj2red",
  "clique",
  "coin",
  "coloring",
  "even_odd",
  "grandparent",
  "sudoku",
]
runs = 10
timeout_seconds = 120
instrumentation = "full"
[experiment.overrides]
algorithm = "steady_state"

[[experiment]]
id = "ilasp-mode-bias-all-120s-10runs/gentians-incremental"
description = "Gentians incremental full pipeline on the nine ILASP mode-bias tasks."
datasets = [
  "4queens",
  "5queens",
  "adj2red",
  "clique",
  "coin",
  "coloring",
  "even_odd",
  "grandparent",
  "sudoku",
]
runs = 10
timeout_seconds = 120
instrumentation = "full"
[experiment.overrides]
algorithm = "incremental"

[[experiment]]
id = "ilasp-generated-5queens-20s/gentians"
label = "5queens · Gentians desde bias"
description = "Full metrics for the ten steady-state runs used in the ILASP comparison."
datasets = ["5queens"]
runs = 10
timeout_seconds = 60
instrumentation = "full"
[experiment.overrides]
algorithm = "steady_state"

# Thirty matched seeds per task. Within each algorithm only mutation probability changes.
[[experiment]]
id = "mutation-rate/steady-control"
description = "Steady-state control with mutation probability 0.9."
runs = 30
[experiment.overrides]
algorithm = "steady_state"
"mutation.probability" = 0.9

[[experiment]]
id = "mutation-rate/steady-050"
description = "Steady-state with mutation probability 0.5."
runs = 30
[experiment.overrides]
algorithm = "steady_state"
"mutation.probability" = 0.5

[[experiment]]
id = "mutation-rate/steady-010"
description = "Steady-state with mutation probability 0.1."
runs = 30
[experiment.overrides]
algorithm = "steady_state"
"mutation.probability" = 0.1

[[experiment]]
id = "mutation-rate/incremental-control"
description = "Incremental control with mutation probability 0.9."
runs = 30
[experiment.overrides]
algorithm = "incremental"
"mutation.probability" = 0.9

[[experiment]]
id = "mutation-rate/incremental-050"
description = "Incremental with mutation probability 0.5."
runs = 30
[experiment.overrides]
algorithm = "incremental"
"mutation.probability" = 0.5

[[experiment]]
id = "mutation-rate/incremental-010"
description = "Incremental with mutation probability 0.1."
runs = 30
[experiment.overrides]
algorithm = "incremental"
"mutation.probability" = 0.1

