# Score weights, selection and replacement compared with matched seeds.
[suite]
output_root = ".benchmarks/experiments"
methods = ["gentians-steady_state"]
datasets = [
    "4queens",
    "5queens",
    "8queens",
    "animals_bird",
    "clique",
    "coin",
    "coloring",
    "even_odd",
    "grandparent",
    "hamming_0",
    "hamming_0_unbalanced",
    "hamming_1",
    "hamming_1_unbalanced",
    "knapsack",
    "latin_square",
    "magic_square_no_diag",
    "penguin",
    "set_partition_sum",
    "set_partition_sum_and_cardinality",
    "set_partition_sum_cardinality_and_square",
    "subset_sum",
    "subset_sum_double",
    "subset_sum_double_and_prod",
    "subset_sum_double_and_prod_unbalanced",
    "subset_sum_double_and_sum",
    "subset_sum_double_unbalanced",
    "subset_sum_double_unbalanced_count",
    "subset_sum_triple",
    "subset_sum_unbalanced",
    "subset_sum_unbalanced_ops",
    "synthetic_million",
]
runs = 100
seed_base = 42
timeout_seconds = 30
validation_timeout_seconds = 60
instrumentation = "full"
cprofile = false

[suite.overrides]
algorithm = "steady_state"
"evaluation.positive_weight" = 1.0
"evaluation.negative_weight" = 1.0

[[experiment]]
id = "score/tour-25-100-oldest"
datasets = ["5queens"]
timeout_seconds = 120
instrumentation = "full"
label = "Tournament 25I · Score 100:1 · Oldest"
description = "Steady state, population 25, tournaments sampling 30% of the population, positive:negative score weights 100:1, oldest-or-worst replacement."
[experiment.overrides]
"population.size" = 25
"evaluation.positive_weight" = 100.0
"selection.name" = "tournament"
"selection.tournament_percentage" = 0.3
"replacement.name" = "oldest_or_worst"
"mutation.name" = "random_group"
"mutation.probability" = 0.9

[[experiment]]
id = "score/comp-mut-25-dg"
datasets = ["5queens"]
timeout_seconds = 120
instrumentation = "full"
label = "Complementary Lexicase 25I · Score 100:1 · Dominated · Duplicate-group"
description = "Steady state, population 25, complementary lexicase selection, positive:negative score weights 100:1, dominated-or-worst replacement, duplicate-group mutation with probability 1.0 per offspring."
[experiment.overrides]
"population.size" = 25
"selection.name" = "complementary_lexicase"
"evaluation.positive_weight" = 100.0
"replacement.name" = "dominated_or_worst"
"mutation.name" = "duplicate_group"

