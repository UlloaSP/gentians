[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gentians"
version = "1.0.1"
description = "GENTIANS: GENeTic algorithm for Inductive learning of ANswer Set programs."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [
    { name = "Damiano Azzolini", email = "damiano.azzolini@unife.it" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "clingo>=5.5",
]

[project.urls]
Homepage = "https://github.com/damianoazzolini/gentians"
"Bug Tracker" = "https://github.com/damianoazzolini/gentians/issues"

[project.scripts]
gentians = "gentians:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "pytest-benchmark>=5.2.3",
]

[tool.setuptools.packages.find]
include = ["gentians*"]

[tool.setuptools.package-data]
gentians = ["logic_programs/*.lp"]
