# List:  python benchmarks/run_experiments.py --list
# Recommended: uv run python benchmarks/run_experiments.py recommended/general
# Rerun: uv run python benchmarks/run_experiments.py recommended/general --force
# All matrices live here. Namespaced IDs preserve their existing output folders.
# Select experiment IDs for a bounded run; omitting IDs runs the whole matrix.
# random_group now includes head-local replacement and dependency-block edits.
# Existing results describe the earlier implementation, not this new policy.
# The former structural entry keeps its ID but uses random_group with jumps off.
[suite]
output_root = ".benchmarks/experiments"
datasets = [
    "5queens",
    "grandparent",
    #"coloring",
    #"latin_square",
    #"magic_square_no_diag",
    #"subset_sum_double",
    #"subset_sum_double_unbalanced",
    #"subset_sum_double_unbalanced_count",
    #"subset_sum_double_and_prod",
    #"subset_sum_double_and_prod_unbalanced",
    #"subset_sum_triple",
    #"set_partition_sum",
    #"set_partition_sum_and_cardinality",
    #"set_partition_sum_cardinality_and_square",
]
runs = 10
timeout_seconds = 100
seed_base = 1
# Deterministic cProfile changes runtime in proportion to Python call count and
# would bias strategy comparisons. Enable it only on a dedicated profiling entry.
cprofile = false

# Controls shared by all fitness experiments.
[suite.overrides]
"mutation.body_local_probability" = 0.0
"mutation.duplicate_retries" = 0
"replacement.complete_quota" = 0
"mutation.random_jump_probability" = 0.1
"mutation.complete_generator_removal_probability" = 0.1

[[experiment]]
id = "population-diversity/control"
description = "Random initialization control for structural diversity."
datasets = ["5queens", "grandparent", "coloring", "knapsack"]
runs = 10
timeout_seconds = 30
seed_base = 1
cprofile = false
instrumentation = "full"
stop_on_timeout = true
[experiment.overrides]
"iterations_genetic" = 0
"evaluation.scoring" = "cov_program"
"evaluation.constraint_inheritance" = true
"evaluation.constraint_diagnosis" = false
"selection.name" = "lexicase"
"crossover.name" = "set_mix"
"crossover.probability" = 1.0
"mutation.name" = "random_group"
"mutation.probability" = 0.9
"mutation.completeness_guidance" = true
"mutation.constraint_only_random" = true
"mutation.repair_probability" = 0.0
"mutation.body_local_probability" = 0.0
"mutation.duplicate_retries" = 0
"mutation.random_jump_probability" = 0.1
"mutation.complete_generator_removal_probability" = 0.1
"population.name" = "random"
"population.size" = 10
"replacement.name" = "oldest_or_worst"
"replacement.prob_replacing_oldest" = 0.1
"replacement.complete_quota" = 0
"clause_pool.enabled" = false

