# List:  python benchmarks/run_experiments.py --list
# Run:   python benchmarks/run_experiments.py cov_subprograms_mean_normal
# Rerun: python benchmarks/run_experiments.py cov_subprograms_mean_normal --force
# Run all entries by omitting experiment IDs.
[suite]
output_root = ".benchmarks"
datasets = ["5queens", "grandparent", "coloring"]
runs = 10
timeout_seconds = 100
seed_base = 1
# Deterministic cProfile changes runtime in proportion to Python call count and
# would bias strategy comparisons. Enable it in a separate profiling config.
cprofile = false

# Controls shared by the entire 3 coverage x 3 grounding matrix. Experiments
# below change only fitness.name and fitness.grounding.
[suite.overrides]

[[experiment]]
id = "cov_subprograms_mean_normal"
label = "Subprograms mean · normal"
description = "Mean score over fixed-size subprograms with per-candidate grounding."

[[experiment]]
id = "cov_subprograms_max_normal"
label = "Subprograms max · normal"
description = "Maximum score over fixed-size subprograms with per-candidate grounding."
[experiment.overrides]
"fitness.name" = "cov_subprograms_max"

[[experiment]]
id = "cov_program_normal"
label = "Whole program · normal"
description = "Score the individual as one whole program with per-candidate grounding."
[experiment.overrides]
"fitness.name" = "cov_program"

[[experiment]]
id = "cov_subprograms_mean_externals"
label = "Subprograms mean · externals"
description = "Mean score over fixed-size subprograms with pre-grounded externals."
[experiment.overrides]
"fitness.grounding" = "externals"

[[experiment]]
id = "cov_subprograms_mean_assumptions"
label = "Subprograms mean · assumptions"
description = "Mean score over fixed-size subprograms with pre-grounded assumptions."
[experiment.overrides]
"fitness.grounding" = "assumptions"

[[experiment]]
id = "cov_whole_program_random_group_mutation"
label = "Whole program · random mutation"
description = "Whole-program fitness using the original random-group mutation."
[experiment.overrides]
"fitness.name" = "cov_program"
"mutation.name" = "random_group"
"mutation.probability" = 0.9

[[experiment]]
id = "cov_whole_program_structural_neighbor_mutation"
label = "Whole program · structural mutation"
description = "Whole-program fitness using structural-neighbor mutation."
[experiment.overrides]
"fitness.name" = "cov_program"
"mutation.name" = "structural_neighbor"
"mutation.probability" = 0.9
"mutation.random_jump_probability" = 0.1
"mutation.sample_size" = 64
