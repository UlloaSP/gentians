# Score weights, selection and replacement compared with matched seeds.
[suite]
output_root = ".benchmarks/experiments"
methods = ["gentians-steady_state"]
datasets = [
    "4queens",
    "5queens",
    "8queens",
    "animals_bird",
    "clique",
    "coin",
    "coloring",
    "constant_colour",
    "euclid",
    "even_odd",
    "grandparent",
    "hamming_0",
    "hamming_0_unbalanced",
    "hamming_1",
    "hamming_1_unbalanced",
    "knapsack",
    "latin_square",
    "magic_square_no_diag",
    "pedro",
    "penguin",
    "set_partition_sum",
    "set_partition_sum_and_cardinality",
    "set_partition_sum_cardinality_and_square",
    "subset_sum",
    "subset_sum_double",
    "subset_sum_double_and_prod",
    "subset_sum_double_and_prod_unbalanced",
    "subset_sum_double_and_sum",
    "subset_sum_double_unbalanced",
    "subset_sum_double_unbalanced_count",
    "subset_sum_triple",
    "subset_sum_unbalanced",
    "subset_sum_unbalanced_ops",
    "synthetic_million",
    "sudoku",
]
runs = 30
seed_base = 42
timeout_seconds = 300
validation_timeout_seconds = 60
instrumentation = "full"
cprofile = false

[suite.overrides]
algorithm = "steady_state"
"evaluation.positive_weight" = 1.0
"evaluation.negative_weight" = 1.0

[[experiment]]
id = "score/lexicase-10-100"
label = "Lexicase 10I · Score 100:1 · Dominated"
description = "Steady state, population 10, lexicase selection, positive:negative score weights 100:1, dominated-or-worst replacement."
[experiment.overrides]
"population.size" = 10
"evaluation.positive_weight" = 100.0
"replacement.name" = "dominated_or_worst"

[[experiment]]
id = "score/lexicase-10-1"
label = "Lexicase 10I · Score 1:1 · Dominated"
description = "Steady state, population 10, lexicase selection, positive:negative score weights 1:1, dominated-or-worst replacement."
[experiment.overrides]
"population.size" = 10
"evaluation.positive_weight" = 1.0
"replacement.name" = "dominated_or_worst"

[[experiment]]
id = "score/tournament-10-100"
label = "Tournament 10I · Score 100:1 · Dominated"
description = "Steady state, population 10, tournaments sampling 30% of the population, positive:negative score weights 100:1, dominated-or-worst replacement."
[experiment.overrides]
"population.size" = 10
"evaluation.positive_weight" = 100.0
"selection.name" = "tournament"
"selection.tournament_percentage" = 0.3
"replacement.name" = "dominated_or_worst"

[[experiment]]
id = "score/tournament-10-1"
label = "Tournament 10I · Score 1:1 · Dominated"
description = "Steady state, population 10, tournaments sampling 30% of the population, positive:negative score weights 1:1, dominated-or-worst replacement."
[experiment.overrides]
"population.size" = 10
"evaluation.positive_weight" = 1.0
"selection.name" = "tournament"
"selection.tournament_percentage" = 0.3
"replacement.name" = "dominated_or_worst"

[[experiment]]
