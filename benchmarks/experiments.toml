# Local comparison of positive:negative score weights, with matched seeds.
[suite]
output_root = ".benchmarks/experiments"
methods = ["gentians-steady_state"]
datasets = ["sudoku"]
runs = 30
seed_base = 42
timeout_seconds = 3600
validation_timeout_seconds = 60
instrumentation = "full"
cprofile = false

[suite.overrides]
algorithm = "steady_state"
"evaluation.positive_weight" = 1.0
"evaluation.negative_weight" = 1.0

[[experiment]]
id = "score/tournament-10-100"
label = "Tournament 10I · Score 100:1"
description = "Positive coverage rate weighted ten times negative rejection rate; other parameters match 1:1."
[experiment.overrides]
"population.size" = 10
"evaluation.positive_weight" = 100.0
"selection.tournament_percentage" = 0.3

[[experiment]]
id = "score/tournament-10-1"
label = "Tournament 10I · Score 1:1"
description = "Positive coverage rate weighted ten times negative rejection rate; other parameters match 1:1."
[experiment.overrides]
"population.size" = 10
"evaluation.positive_weight" = 100
"selection.tournament_percentage" = 0.3


[[experiment]]
id = "score/tournament-10-100-600"
label = "Tournament 10I · Score 100:1"
description = "Positive coverage rate weighted ten times negative rejection rate; other parameters match 1:1."
[experiment.overrides]
"population.size" = 10
"evaluation.positive_weight" = 100.0
"selection.tournament_percentage" = 0.3

[[experiment]]
id = "score/tournament-10-1-600"
label = "Tournament 10I · Score 1:1"
description = "Positive coverage rate weighted ten times negative rejection rate; other parameters match 1:1."
[experiment.overrides]
"population.size" = 10
"evaluation.positive_weight" = 100
"selection.tournament_percentage" = 0.3
