label = "Tournament 10I · Score 100:1 · Oldest"
description = "Steady state, population 10, tournaments sampling 30% of the population, positive:negative score weights 100:1, oldest-or-worst replacement."
[experiment.overrides]
"population.size" = 10
"evaluation.positive_weight" = 100.0
"selection.name" = "tournament"
"selection.tournament_percentage" = 0.3
"replacement.name" = "oldest_or_worst"

