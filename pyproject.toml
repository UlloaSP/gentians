[build-system]
requires = [
    "setuptools>=42",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "gentians"
version = "1.0.1"
description = "GENTIANS: GENeTic algorithm for Inductive learning of ANswer Set programs."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Damiano Azzolini", email = "damiano.azzolini@unife.it" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU GPLv3 License",
    "Operating System :: OS Independent",
]
dependencies = [
    "clingo>=5.5",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/damianoazzolini/gentians"
"Bug Tracker" = "https://github.com/damianoazzolini/gentians/issues"

[dependency-groups]
dev = [
    "pylint",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["gentians*"]

[tool.setuptools.package-data]
gentians = ["logic_programs/*.lp"]

[tool.pytest.ini_options]
pythonpath = ["."]
