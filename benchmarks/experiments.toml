[[experiment]]
id = "cov_program_random_group_pop10_mut09"
label = "Whole program · random · population 10 · mutation 0.9"
description = "Random-group mutation with population 10 and mutation probability 0.9."
[experiment.overrides]
"fitness.name" = "cov_program"
"mutation.name" = "random_group"
"population.size" = 10
"mutation.probability" = 0.9

[[experiment]]
id = "cov_program_random_group_pop100_mut09"
label = "Whole program · random · population 100 · mutation 0.9"
description = "Random-group mutation with population 100 and mutation probability 0.9."
[experiment.overrides]
"fitness.name" = "cov_program"
"mutation.name" = "random_group"
"population.size" = 100
"mutation.probability" = 0.9

[[experiment]]
id = "cov_program_structural_neighbor_pop10_mut09"
label = "Whole program · structural · population 10 · mutation 0.9"
description = "Structural-neighbor mutation with population 10 and mutation probability 0.9."
[experiment.overrides]
"fitness.name" = "cov_program"
"mutation.name" = "structural_neighbor"
"population.size" = 10
"mutation.probability" = 0.9
"mutation.random_jump_probability" = 0.1

