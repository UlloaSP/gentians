# SDK baseline and matched mutation-probability experiments.
[suite]
output_root = ".benchmarks/experiments"
datasets = [
  "coin",
  "adj2red",
  "clique",
  "4queens",
  "8queens",
  "5queens",
  "even_odd",
  "grandparent",
  "sudoku",
  "coloring",
  "knapsack",
  "latin_square",
  "magic_square_no_diag",
  "penguin",
]
runs = 10
seed_base = 42
timeout_seconds = 30
cprofile = false
instrumentation = "full"
validation_timeout_seconds = 60

[[experiment]]
id = "test-defaults/steady_state"
datasets = ["5queens"]
description = "Steady-state with current SDK defaults."
runs = 30
[experiment.overrides]
algorithm = "steady_state"

[[experiment]]
id = "test-defaults/incremental"
datasets = ["5queens"]
description = "Incremental with current SDK defaults."
runs = 30
[experiment.overrides]
algorithm = "incremental"

[[experiment]]
id = "sdk-defaults/steady_state"
description = "Steady-state with current SDK defaults."
runs = 30
[experiment.overrides]
algorithm = "steady_state"

[[experiment]]
id = "sdk-defaults/incremental"
description = "Incremental with current SDK defaults."
runs = 30
[experiment.overrides]
algorithm = "incremental"

[[experiment]]
id = "alzheimer/incremental"
description = "Four Alzheimer's drug-design tasks from the ILP datasets collection."
datasets = [
  "alzheimer_acetyl",
  "alzheimer_amine",
  "alzheimer_mem",
  "alzheimer_toxic",
]
runs = 1
timeout_seconds = 1200
instrumentation = "full"
[experiment.overrides]
algorithm = "incremental"

[[experiment]]
id = "alzheimer/population-10"
label = "Alzheimer · 10 individuos"
description = "Four Alzheimer tasks with population 10, one run per method and a 1000-second timeout."
methods = [
  "gentians-steady_state",
  "gentians-incremental",
  "ilasp-2",
  "ilasp-2i",
]
datasets = [
  "alzheimer_acetyl",
  "alzheimer_amine",
  "alzheimer_mem",
  "alzheimer_toxic",
]
runs = 30
timeout_seconds = 3600
instrumentation = "full"
[experiment.overrides]
"population.size" = 10

[[experiment]]
id = "alzheimer/population-100"
label = "Alzheimer · 100 individuos"
description = "Four Alzheimer tasks with population 100, one run per method and a 1000-second timeout."
methods = [
  "gentians-steady_state",
  "gentians-incremental",
  "ilasp-2",
  "ilasp-2i",
]
datasets = [
  "alzheimer_acetyl",
  "alzheimer_amine",
  "alzheimer_mem",
  "alzheimer_toxic",
]
runs = 30
timeout_seconds = 3600
instrumentation = "full"
[experiment.overrides]
"population.size" = 100

[[experiment]]
id = "ilasp-mode-bias-all-30s-3runs"
methods = [
  "gentians-steady_state",
  "gentians-incremental",
  "ilasp-2",
  "ilasp-2i",
]
description = "Matched Gentians and ILASP methods on the same tasks and timeout."
datasets = [
  "4queens",
  "5queens",
  "adj2red",
  "clique",
  "coin",
  "coloring",
  "even_odd",
  "grandparent",
  "sudoku",
]
runs = 3
timeout_seconds = 30
instrumentation = "full"

[[experiment]]
id = "ilasp-mode-bias-all-120s-10runs"
methods = [
  "gentians-steady_state",
  "gentians-incremental",
  "ilasp-2",
  "ilasp-2i",
]
description = "Matched Gentians and ILASP methods on the same tasks and timeout."
datasets = [
  "4queens",
  "5queens",
  "adj2red",
  "clique",
  "coin",
  "coloring",
  "even_odd",
  "grandparent",
  "sudoku",
]
runs = 10
timeout_seconds = 120
instrumentation = "full"

[[experiment]]
id = "ilasp-mode-bias-5queens-20s"
methods = [
  "gentians-steady_state",
  "gentians-incremental",
  "ilasp-2",
  "ilasp-2i",
]
description = "Matched 5queens methods from mode bias, with one deterministic ILASP run per version."
datasets = ["5queens"]
runs = 10
timeout_seconds = 20
instrumentation = "full"

[[experiment]]
id = "ilasp-generated-5queens-20s/gentians"
label = "5queens · Gentians desde bias"
description = "Full metrics for the ten steady-state runs used in the ILASP comparison."
datasets = ["5queens"]
runs = 10
timeout_seconds = 60
instrumentation = "full"
[experiment.overrides]
algorithm = "steady_state"

# Thirty matched seeds per task. Within each algorithm only mutation probability changes.
[[experiment]]
id = "mutation-rate/steady-control"
description = "Steady-state control with mutation probability 0.9."
runs = 30
[experiment.overrides]
algorithm = "steady_state"
"mutation.probability" = 0.9

[[experiment]]
id = "mutation-rate/steady-050"
description = "Steady-state with mutation probability 0.5."
runs = 30
[experiment.overrides]
algorithm = "steady_state"
"mutation.probability" = 0.5

[[experiment]]
id = "mutation-rate/steady-010"
description = "Steady-state with mutation probability 0.1."
runs = 30
[experiment.overrides]
algorithm = "steady_state"
"mutation.probability" = 0.1

[[experiment]]
id = "mutation-rate/incremental-control"
description = "Incremental control with mutation probability 0.9."
runs = 30
[experiment.overrides]
algorithm = "incremental"
"mutation.probability" = 0.9

[[experiment]]
id = "mutation-rate/incremental-050"
description = "Incremental with mutation probability 0.5."
runs = 30
[experiment.overrides]
algorithm = "incremental"
"mutation.probability" = 0.5

[[experiment]]
id = "mutation-rate/incremental-010"
description = "Incremental with mutation probability 0.1."
runs = 30
[experiment.overrides]
algorithm = "incremental"
"mutation.probability" = 0.1

